name: VeltrixSecurity
options:
  bundleIdPrefix: com.cynaxia
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.cynaxia.veltrixsecurity
    PRODUCT_NAME: VeltrixSecurity
    ARCHS: arm64 x86_64
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Veltrix Security
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  VeltrixSecurity:
    type: application
    platform: macOS
    sources:
      - path: VeltrixSecurityApp
    resources:
      - path: VeltrixSecurityApp/Resources/Localizable.xcstrings
      - path: VeltrixSecurityApp/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cynaxia.veltrixsecurity
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  VeltrixSecurityTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/VeltrixSecurityTests
    settings:
      base:
        PRODUCT_NAME: VeltrixSecurityTests
    dependencies:
      - target: VeltrixSecurity
schemes:
  VeltrixSecurity:
    build:
      targets:
        VeltrixSecurity: all
        VeltrixSecurityTests: [test]
    test:
      config: Debug
      targets:
        - VeltrixSecurityTests
