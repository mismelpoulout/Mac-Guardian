name: MacGuardian
options:
  bundleIdPrefix: com.cynaxia
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.cynaxia.macguardian
    PRODUCT_NAME: MacGuardian
    ARCHS: arm64 x86_64
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Mac Guardian
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MacGuardian:
    type: application
    platform: macOS
    sources:
      - path: MacGuardianApp
    resources:
      - path: MacGuardianApp/Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cynaxia.macguardian
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
  MacGuardianTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacGuardianTests
    settings:
      base:
        PRODUCT_NAME: MacGuardianTests
    dependencies:
      - target: MacGuardian
schemes:
  MacGuardian:
    build:
      targets:
        MacGuardian: all
        MacGuardianTests: [test]
    test:
      config: Debug
      targets:
        - MacGuardianTests
